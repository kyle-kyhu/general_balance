{% extends "web/base.html" %}
{% load static %}

{% block title %}{{ workflow.name }} - Details{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col">
            <h1>{{ workflow.name }}</h1>
            <div class="card">
                <div class="card-body">
                    <p class="card-text">{{ workflow.description }}</p>
                    <p class="text-muted">Created: {{ workflow.created_at|date:"M d, Y" }}</p>
                    
                    <div class="mt-3">
                        <a href="{% url 'workflows:workflow_edit' workflow.pk %}" class="btn btn-primary">Edit</a>
                        <a href="{% url 'workflows:workflow_delete' workflow.pk %}" class="btn btn-danger">Delete</a>
                        <a href="{% url 'workflows:workflow_list' %}" class="btn btn-secondary">Back to List</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
